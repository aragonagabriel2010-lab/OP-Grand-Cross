<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d2b3"/>
      <stop offset="100%" stop-color="#d4a07a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Wanted-poster style board -->
  <rect width="300" height="400" fill="url(#paper)"/>
  <rect x="12" y="12" width="276" height="376" stroke="#1a120a" stroke-width="6" fill="none"/>
  <rect x="22" y="22" width="256" height="356" stroke="#5c4030" stroke-width="2" fill="none" opacity="0.45"/>
  <!-- vignette -->
  <rect x="40" y="70" width="220" height="250" rx="8" fill="#0b161b" opacity="0.08"/>
  <!-- legs -->
  <rect x="118" y="290" width="26" height="78" rx="8" fill="#1e3a5f"/>
  <rect x="156" y="290" width="26" height="78" rx="8" fill="#1e3a5f"/>
  <!-- torso -->
  <ellipse cx="150" cy="268" rx="48" ry="52" fill="#f8fafc"/>
  <path d="M110 230 L150 250 L190 230 L184 300 L116 300 Z" fill="#e2e8f0"/>
  <rect x="136" y="248" width="28" height="12" rx="2" fill="#1d4ed8"/>
  <!-- arms -->
  <ellipse cx="95" cy="260" rx="15" ry="36" fill="url(#skin)"/>
  <ellipse cx="205" cy="260" rx="15" ry="36" fill="url(#skin)"/>
  <!-- head -->
  <ellipse cx="150" cy="150" rx="48" ry="52" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M98 140 C104 78 130 62 150 62 C175 62 200 78 204 140 C186 108 168 102 150 104 C132 102 114 110 98 140Z" fill="url(#hair)"/>
  <path d="M98 145 C90 128 98 118 110 128 C102 134 98 140 98 145Z" fill="#db2777"/>
  <path d="M202 145 C210 128 202 118 190 128 C198 134 202 140 202 145Z" fill="#db2777"/>
  <!-- glasses -->
  <rect x="118" y="145" width="26" height="18" rx="3" stroke="#0f172a" stroke-width="3.5" fill="rgba(125,211,252,0.2)"/>
  <rect x="156" y="145" width="26" height="18" rx="3" stroke="#0f172a" stroke-width="3.5" fill="rgba(125,211,252,0.2)"/>
  <path d="M144 154 H156" stroke="#0f172a" stroke-width="3.5"/>
  <ellipse cx="131" cy="154" rx="5" ry="6" fill="#0f172a"/>
  <ellipse cx="169" cy="154" rx="5" ry="6" fill="#0f172a"/>
  <circle cx="132.5" cy="152" r="1.6" fill="#fff"/>
  <circle cx="170.5" cy="152" r="1.6" fill="#fff"/>
  <path d="M136 178 Q150 188 164 178" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1a120a" letter-spacing="3">WANTED</text>
</svg>
