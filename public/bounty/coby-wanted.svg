<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d7a8"/>
      <stop offset="100%" stop-color="#c9a36a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d2b3"/>
      <stop offset="100%" stop-color="#d4a07a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <!-- full-bleed parchment (no letterbox) so cover crop matches photo portraits -->
  <rect width="300" height="400" fill="url(#paper)"/>
  <!-- body -->
  <ellipse cx="150" cy="360" rx="120" ry="70" fill="#e8eef5"/>
  <path d="M70 250 L150 280 L230 250 L245 410 L55 410 Z" fill="#f1f5f9"/>
  <rect x="132" y="268" width="36" height="16" rx="2" fill="#1d4ed8"/>
  <!-- arms -->
  <ellipse cx="58" cy="290" rx="22" ry="55" fill="url(#skin)"/>
  <ellipse cx="242" cy="290" rx="22" ry="55" fill="url(#skin)"/>
  <!-- head large, photo-like crop -->
  <ellipse cx="150" cy="155" rx="78" ry="86" fill="url(#skin)"/>
  <path d="M70 140 C82 40 118 18 150 18 C190 18 230 45 232 140 C205 88 180 78 150 82 C120 78 95 92 70 140Z" fill="url(#hair)"/>
  <!-- glasses -->
  <rect x="95" y="145" width="42" height="30" rx="5" stroke="#0f172a" stroke-width="6" fill="rgba(125,211,252,0.2)"/>
  <rect x="163" y="145" width="42" height="30" rx="5" stroke="#0f172a" stroke-width="6" fill="rgba(125,211,252,0.2)"/>
  <path d="M137 160 H163" stroke="#0f172a" stroke-width="6"/>
  <ellipse cx="116" cy="160" rx="9" ry="10" fill="#0f172a"/>
  <ellipse cx="184" cy="160" rx="9" ry="10" fill="#0f172a"/>
  <circle cx="119" cy="157" r="3" fill="#fff"/>
  <circle cx="187" cy="157" r="3" fill="#fff"/>
  <path d="M122 205 Q150 225 178 205" stroke="#9a3412" stroke-width="5" stroke-linecap="round"/>
</svg>
